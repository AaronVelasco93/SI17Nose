<VirtualHost *:80>
    #sirve para la app se vea desde /public(entrada web del proyecto de php)    
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        #permite la sobre escritura por .htaccess en caso de que lo ocupemos
        AllowOverride All
        Require all granted
    </Directory>
    # Losg estandar de Apache para disgnostico
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    

</VirtualHost>